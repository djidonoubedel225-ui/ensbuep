
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1f3a">

    <title>Connexion administrateur | BUEP-ENS/PN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #0b1f3a;
            --navy-light: #15375e;
            --gold: #d6ad55;
            --white: #ffffff;
            --light: #f4f6fa;
            --text: #243247;
            --muted: #718096;
            --border: #dce2eb;
            --danger: #c0392b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            background:
                linear-gradient(135deg, rgba(11,31,58,.97), rgba(21,55,94,.94));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 28px;
        }

        .brand-symbol {
            width: 72px;
            height: 72px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--gold);
            font-family: "Playfair Display", serif;
            font-size: 27px;
            font-weight: 700;
        }

        .brand h1 {
            font-family: "Playfair Display", serif;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .brand p {
            font-size: 13px;
            color: #d2dbea;
        }

        .login-card {
            background: var(--white);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.22);
        }

        .card-heading {
            margin-bottom: 28px;
        }

        .card-heading h2 {
            color: var(--navy);
            font-size: 22px;
            margin-bottom: 8px;
        }

        .card-heading p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 49px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 14px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: .2s;
        }

        .form-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(214,173,85,.15);
        }

        .login-button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 8px;
            background: var(--navy);
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .login-button:hover {
            background: var(--navy-light);
        }

        .login-button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .feedback {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.5;
        }

        .feedback.error {
            display: block;
            background: #fff0ef;
            color: var(--danger);
        }

        .feedback.success {
            display: block;
            background: #edf8f0;
            color: #24713a;
        }

        .security-note {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        .back-link {
            display: block;
            text-align: center;
            color: white;
            text-decoration: none;
            font-size: 13px;
            margin-top: 22px;
        }

        .back-link:hover {
            color: var(--gold);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }

            .brand h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <main class="login-wrapper">

        <header class="brand">
            <div class="brand-symbol">BUEP</div>
            <h1>BUEP-ENS/PN</h1>
            <p>Portail institutionnel de l'ENS de Porto-Novo</p>
        </header>

        <section class="login-card">

            <div class="card-heading">
                <h2>Espace administrateur</h2>
                <p>
                    Connectez-vous avec les identifiants de votre
                    compte administrateur.
                </p>
            </div>

            <div id="loginFeedback" class="feedback" role="alert"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@exemple.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Se connecter
                </button>

            </form>

            <div class="security-note">
                <p>
                    <strong>Accès réservé</strong><br>
                    Cet espace est exclusivement destiné aux
                    administrateurs autorisés du BUEP-ENS/PN.
                </p>
            </div>

        </section>

        <a href="../index.html" class="back-link">
            ← Retour au site public
        </a>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/supabase.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const form = document.getElementById("loginForm");
            const button = document.getElementById("loginButton");
            const feedback = document.getElementById("loginFeedback");

            function showFeedback(message, type = "error") {
                feedback.textContent = message;
                feedback.className = "feedback " + type;
            }

            function setLoading(isLoading) {
                button.disabled = isLoading;
                button.textContent = isLoading
                    ? "Connexion en cours..."
                    : "Se connecter";
            }

            if (!window.buepSupabase) {
                showFeedback(
                    "Le service de connexion est indisponible. Vérifiez la configuration Supabase."
                );
                button.disabled = true;
                return;
            }

            const supabase = window.buepSupabase;

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                feedback.className = "feedback";
                setLoading(true);

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (error) throw error;

                    const user = data.user;

                    if (!user) {
                        throw new Error("Utilisateur non identifié.");
                    }

                    const { data: profile, error: profileError } = await supabase
                        .from("profiles")
                        .select("user_id, display_name, account_status, is_principal_admin")
                        .eq("user_id", user.id)
                        .maybeSingle();

                    if (profileError) throw profileError;

                    if (!profile || profile.account_status !== "active") {
                        await supabase.auth.signOut();

                        throw new Error(
                            "Ce compte n'est pas autorisé à accéder à l'administration."
                        );
                    }

                    showFeedback(
                        "Connexion réussie. Ouverture de votre espace...",
                        "success"
                    );

                    window.location.href = "gestion.html";

                } catch (error) {
                    console.error("Erreur de connexion :", error);

                    const message = error.message === "Invalid login credentials"
                        ? "Adresse e-mail ou mot de passe incorrect."
                        : error.message;

                    showFeedback(message);
                } finally {
                    setLoading(false);
                }
            });

            // Vérifier si une session existe déjà.
            (async () => {
                const { data } = await supabase.auth.getSession();

                if (data.session) {
                    window.location.href = "gestion.html";
                }
            })();

        });
    </script>

</body>
</html>


<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1f3a">

    <title>Connexion administrateur | BUEP-ENS/PN</title>


    <style>
        :root {
            --navy: #0b1f3a;
            --navy-light: #15375e;
            --gold: #d6ad55;
            --white: #ffffff;
            --light: #f4f6fa;
            --text: #243247;
            --muted: #718096;
            --border: #dce2eb;
            --danger: #c0392b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "BUEP-Digits", "DM Sans", sans-serif;
            background:
                linear-gradient(135deg, rgba(11,31,58,.97), rgba(21,55,94,.94));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 28px;
        }

        .brand-symbol {
            width: 72px;
            height: 72px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--gold);
            font-family: "BUEP-Digits", "Playfair Display", serif;
            font-size: 27px;
            font-weight: 700;
        }

        .brand h1 {
            font-family: "BUEP-Digits", "Playfair Display", serif;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .brand p {
            font-size: 13px;
            color: #d2dbea;
        }

        .login-card {
            background: var(--white);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.22);
        }

        .card-heading {
            margin-bottom: 28px;
        }

        .card-heading h2 {
            color: var(--navy);
            font-size: 22px;
            margin-bottom: 8px;
        }

        .card-heading p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 49px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 14px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: .2s;
        }

        .form-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(214,173,85,.15);
        }

        .login-button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 8px;
            background: var(--navy);
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .login-button:hover {
            background: var(--navy-light);
        }

        .login-button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .feedback {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.5;
        }

        .feedback.error {
            display: block;
            background: #fff0ef;
            color: var(--danger);
        }

        .feedback.success {
            display: block;
            background: #edf8f0;
            color: #24713a;
        }

        .security-note {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        .back-link {
            display: block;
            text-align: center;
            color: white;
            text-decoration: none;
            font-size: 13px;
            margin-top: 22px;
        }

        .back-link:hover {
            color: var(--gold);
        }

        /* Ordinateur : formulaire compact, sans défilement de la page */
        @media (min-width: 761px) {
            body { padding: 16px 24px; }
            .brand { margin-bottom: 16px; }
            .brand h1 { font-size: 24px; margin-bottom: 4px; }
            .brand p { font-size: 12px; }
            .login-card { padding: 26px 30px; }
            .card-heading { margin-bottom: 18px; }
            .card-heading h2 { font-size: 20px; margin-bottom: 4px; }
            .card-heading p { font-size: 13px; }
            .form-group { margin-bottom: 14px; }
            .form-group label { margin-bottom: 6px; }
            .form-group input { height: 44px; }
            .login-button { height: 46px; }
            .feedback { margin-bottom: 12px; }
            .security-note { margin-top: 16px; padding-top: 12px; }
            .back-link { margin-top: 14px; }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }

            .brand h1 {
                font-size: 22px;
            }
        }
    
/* Panneau clair à gauche, séparé du formulaire par un trait penché. Le logo importé y figure en clair. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: #f7f4ec;
  clip-path: polygon(0 0, 50% 0, 38% 100%, 0 100%);
  pointer-events: none;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--gold, #d6ad55);
  clip-path: polygon(50% 0, calc(50% + 3px) 0, calc(38% + 3px) 100%, 38% 100%);
  pointer-events: none;
  z-index: -2;
}

/* Logo importé : médaillon rond, centré dans le panneau clair */
.login-panel-logo {
  display: none;
  position: fixed;
  top: 50%;
  left: 19vw;
  width: min(22vw, 250px);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background-color: #fff;
  background-image: var(--login-logo, none);
  background-repeat: no-repeat;
  background-position: center;
  background-size: 74%;
  border: 6px solid var(--gold, #d6ad55);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
  pointer-events: none;
  z-index: -1;
  max-width: 100%;
}
html.has-login-logo .login-panel-logo { display: block; }

@media (max-width: 760px) {
  .login-panel-logo { display: none !important; }
}

/* Formulaire décalé légèrement vers la droite, sur PC */
@media (min-width: 761px) {
  body {
    justify-content: flex-end;
    padding-right: 9vw;
  }
}

/* Sur téléphone, le panneau disparaît : le formulaire reste centré */
@media (max-width: 760px) {
  body::before,
  body::after {
    display: none;
  }
}

        /* Police unique de la page (même famille que le reste du site) */
        html body, html body * {
            font-family: "Plus Jakarta Sans", Arial, sans-serif !important;
            word-spacing: .14em;
        }
</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-panel-logo" aria-hidden="true"></div>

    <main class="login-wrapper">

        <header class="brand">
            <h1>BUEP-ENS/PN</h1>
            <p>Portail institutionnel de l'ENS de Porto-Novo</p>
        </header>

        <section class="login-card">

            <div class="card-heading">
                <h2>Espace administrateur</h2>
                <p>
                    Connectez-vous avec les identifiants de votre
                    compte administrateur.
                </p>
            </div>

            <div id="loginFeedback" class="feedback" role="alert"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@exemple.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Se connecter
                </button>

            </form>

            <div class="security-note">
                <p>
                    <strong>Accès réservé</strong><br>
                    Cet espace est exclusivement destiné aux
                    administrateurs autorisés du BUEP-ENS/PN.
                </p>
            </div>

        </section>

        <a href="../index.html" class="back-link">
            ← Retour au site public
        </a>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/supabase.js"></script>
<script>
(function () {
  function setWatermark(url) {
    if (url) {
      document.documentElement.style.setProperty("--login-logo", 'url("' + url + '")');
      document.documentElement.classList.add("has-login-logo");
    }
  }

  // 0. Logo par défaut du portail : visible dès le premier affichage
  setWatermark("../assets/img/logo-buep.png");

  // 1. Logo déjà mémorisé dans le navigateur (affiché immédiatement)
  try {
    const cached = JSON.parse(localStorage.getItem("buep-logo-cache") || "null");
    if (cached) setWatermark(cached.data || cached.url);
  } catch (e) { /* pas de cache */ }

  // 2. Sinon, le logo importé dans les réglages du site
  const db = window.buepSupabase;
  if (!db) return;
  Promise.resolve(db.from("site_settings")
    .select("setting_value")
    .eq("setting_key", "site_branding")
    .maybeSingle())
    .then(({ data }) => {
      const path = data && data.setting_value && data.setting_value.logo_path;
      if (!path) return;
      const { data: file } = db.storage.from("buep-public-assets").getPublicUrl(path);
      if (file && file.publicUrl) setWatermark(file.publicUrl);
    })
    .catch(() => { /* filigrane facultatif */ });
})();
</script>


    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const form = document.getElementById("loginForm");
            const button = document.getElementById("loginButton");
            const feedback = document.getElementById("loginFeedback");

            function showFeedback(message, type = "error") {
                feedback.textContent = message;
                feedback.className = "feedback " + type;
            }

            function setLoading(isLoading) {
                button.disabled = isLoading;
                button.textContent = isLoading
                    ? "Connexion en cours..."
                    : "Se connecter";
            }

            if (!window.buepSupabase) {
                showFeedback(
                    "Le service de connexion est indisponible. Vérifiez la configuration Supabase."
                );
                button.disabled = true;
                return;
            }

            const supabase = window.buepSupabase;

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                feedback.className = "feedback";
                setLoading(true);

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;

                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (error) throw error;

                    const user = data.user;

                    if (!user) {
                        throw new Error("Utilisateur non identifié.");
                    }

                    const { data: profile, error: profileError } = await supabase
                        .from("profiles")
                        .select("user_id, display_name, account_status, is_principal_admin")
                        .eq("user_id", user.id)
                        .maybeSingle();

                    if (profileError) throw profileError;

                    if (!profile || profile.account_status !== "active") {
                        await supabase.auth.signOut();

                        throw new Error(
                            "Ce compte n'est pas autorisé à accéder à l'administration."
                        );
                    }

                    showFeedback(
                        "Connexion réussie. Ouverture de votre espace...",
                        "success"
                    );

                    window.location.href = "gestion.html";

                } catch (error) {
                    console.error("Erreur de connexion :", error);

                    const message = error.message === "Invalid login credentials"
                        ? "Adresse e-mail ou mot de passe incorrect."
                        : error.message;

                    showFeedback(message);
                } finally {
                    setLoading(false);
                }
            });

            // Vérifier si une session existe déjà.
            (async () => {
                const { data } = await supabase.auth.getSession();

                if (data.session) {
                    window.location.href = "gestion.html";
                }
            })();

        });
    </script>

</body>
</html>
